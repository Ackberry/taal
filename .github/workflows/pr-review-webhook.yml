name: Trigger PR Review Webhook

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook to Bubu
        env:
          WEBHOOK_URL: ${{ secrets.TAAL_REVIEW_WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.TAAL_REVIEW_WEBHOOK_AUTH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg action "opened" \
            --arg repo "$REPO" \
            --argjson number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            '{action: $action, repository: $repo, pull_request: {number: $number, title: $title, html_url: $url, user: {login: $author}}}' \
          | curl -fsS -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: $WEBHOOK_AUTH" \
              --data-binary @-